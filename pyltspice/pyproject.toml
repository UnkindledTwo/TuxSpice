[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyltspice"
version = "0.1.0"
description = "Native Linux, LTspice-compatible schematic capture and waveform viewer using ngspice"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "numpy", "pyqtgraph"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pyltspice = "pyltspice.app:main"
pyltspice-mcp = "pyltspice.mcp.bridge:main"

[tool.setuptools.packages.find]
include = ["pyltspice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
